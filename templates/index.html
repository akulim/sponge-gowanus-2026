<!DOCTYPE html>
<html>
<head>
    <title>GOWANUS DARK | Command</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #0b0e14; --card: #161b22; --text: #c9d1d9; --accent: #58a6ff; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar Control */
        .sidebar { width: 300px; background: var(--card); padding: 30px; border-right: 1px solid #30363d; }
        
        /* Main Dashboard */
        .main { flex-grow: 1; padding: 40px; display: flex; flex-direction: column; gap: 20px; position: relative; }
        
        /* The Animated Water Tank */
        .water-tank { position: absolute; bottom: 0; right: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.3; transition: 1s ease-in-out; }
        .wave { position: absolute; bottom: 0; width: 100%; background: #238636; transition: 1s; }

        /* Scorecards */
        .score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .scorecard { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #30363d; }
        .scorecard h4 { margin: 0; color: #8b949e; text-transform: uppercase; font-size: 12px; }
        .scorecard .val { font-size: 32px; font-weight: bold; margin: 10px 0; }
        
        input[type="date"] { background: #0d1117; color: white; border: 1px solid #30363d; padding: 10px; width: 100%; border-radius: 5px; }
    </style>
</head>
<body>

    <div style="margin-top: 30px; font-size: 13px; color: #8b949e;">
    <h4>LEGEND</h4>
    <div style="display: flex; align-items: center; margin-bottom: 8px;">
        <div style="width: 12px; height: 12px; background: #58a6ff; margin-right: 10px; border-radius: 2px;"></div>
        <span>Water Level (Gage ft)</span>
    </div>
    <div style="display: flex; align-items: center; margin-bottom: 20px;">
        <div style="width: 12px; height: 12px; border: 2px dashed #0070f3; margin-right: 10px; border-radius: 2px;"></div>
        <span>Contamination Index (%)</span>
    </div>

    <h4>CONTAMINATION SCALE</h4>
    <p><span style="color: #0070f3;">●</span> 0-50%: Safe (Tidal Flow)</p>
    <p><span style="color: #7928ca;">●</span> 51-75%: Caution (Runoff)</p>
    <p><span style="color: #ff0000;">●</span> 76-100%: Danger (CSO Event)</p>
</div>

    <div class="main">
        <div class="score-grid">
            <div class="scorecard">
                <h4>Water Level</h4>
                <div class="val" id="lvl-val">0.00 ft</div>
            </div>
            <div class="scorecard">
                <h4>Contamination (CSO)</h4>
                <div class="val" id="tox-val" style="color: #238636;">0%</div>
            </div>
        </div>

        <div style="background: var(--card); padding: 20px; border-radius: 12px; height: 400px;">
            <canvas id="mainChart"></canvas>
        </div>

        <div class="water-tank">
            <div id="wave-bg" class="wave" style="height: 20%;"></div>
        </div>
    </div>

    <script>
    let chart;
    function fetchData() {
        const date = document.getElementById('datePicker').value;
        fetch(`/api/data?date=${date}`).then(r => r.json()).then(data => {
            const latestTox = data.toxins[data.toxins.length - 1];
            const latestLvl = data.levels[data.levels.length - 1];

            // --- COLOR LOGIC ---
            let themeColor = "#0070f3"; // Normal Blue
            let statusText = "SAFE";

            if (latestTox > 50 && latestTox <= 75) {
                themeColor = "#7928ca"; // Purple
                statusText = "CAUTION";
            } else if (latestTox > 75) {
                themeColor = "#ff0000"; // Red
                statusText = "DANGER";
            }

            // --- 1. UPDATE SCORECARDS ---
            document.getElementById('lvl-val').innerText = latestLvl.toFixed(2) + " ft";
            document.getElementById('tox-val').innerText = Math.round(latestTox) + "%";
            document.getElementById('tox-val').style.color = themeColor;
            document.getElementById('risk-text').innerText = statusText;
            document.getElementById('risk-text').style.color = themeColor;

            // --- 2. UPDATE ANIMATION ---
            document.getElementById('wave-bg').style.backgroundColor = themeColor;
            document.getElementById('wave-bg').style.boxShadow = `0 0 50px ${themeColor}55`;
            document.getElementById('wave-bg').style.height = (latestLvl / 5 * 100) + "%";

            // --- 3. UPDATE CHART ---
            if (chart) chart.destroy();
            const ctx = document.getElementById('mainChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.labels,
                    datasets: [
                        { 
                            label: 'Level', 
                            data: data.levels, 
                            borderColor: '#58a6ff', 
                            tension: 0.4, 
                            yAxisID: 'y',
                            pointRadius: 0 // Makes it look cleaner
                        },
                        { 
                            label: 'Toxins', 
                            data: data.toxins, 
                            borderColor: themeColor, // FIXED: Changed from 'color' to 'themeColor'
                            borderDash: [5, 5], 
                            yAxisID: 'y1',
                            pointRadius: 0 
                        }
                    ]
                },
                options: {
                        responsive: true,
                        maintainAspectRatio: false,
                scales: {
                        y: { position: 'left', grid: { color: '#30363d' }, ticks: { color: '#8b949e' } },
                        y1: { position: 'right', display: false },
                        x: { ticks: { color: '#8b949e' } }
                        },
                plugins: { 
                legend: { 
                    display: true, 
                    position: 'top',
                    labels: {
                        color: '#c9d1d9', // Light gray text for dark mode
                        font: { size: 12 },
                        usePointStyle: true // Makes the icons circles/lines instead of boxes
            }
        } 
    }
}
            });
        });
    }
    fetchData(); // Run on load
</script>
</body>
</html>
