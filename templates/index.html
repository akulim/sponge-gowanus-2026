<!DOCTYPE html>
<html>
<head>
    <title>Gowanus Forensic Predictor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; margin: 0; padding: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1200px; margin: auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        #canvas-wrap { height: 300px; background: #0f172a; border-radius: 8px; position: relative; overflow: hidden; }
        canvas#water { position: absolute; bottom: 0; }
        h1 { text-align: center; color: #38bdf8; }
    </style>
</head>
<body>
    <h1>Gowanus Predictive Analytics</h1>
    
    <div class="grid">
        <div class="card">
            <h3>Visualizing the Pulse</h3>
            <div id="canvas-wrap">
                <canvas id="water"></canvas>
            </div>
            <p id="prediction-text" style="font-weight: bold; margin-top: 15px;">Status: Analyzing...</p>
        </div>

        <div class="card">
            <h3>Rainfall vs. Contamination (Historical)</h3>
            <canvas id="myChart"></canvas>
        </div>
    </div>

    <script>
        async function showHistorical() {
    const res = await fetch('/api/historical');
    const data = await res.json();
    updateChart(data.labels, data.values, "Historical Surge (Oct 30)");
}

async function showForecast() {
    const res = await fetch('/api/forecast');
    const data = await res.json();
    const labels = data.map(d => d.time);
    const values = data.map(d => d.value);
    updateChart(labels, values, "Predicted Level (March 1-2)", true); // Pass true for 'dotted line'
}
        // 1. Fetch Data and Setup Chart
        async function initDashboard() {
            const res = await fetch('/api/historical-data');
            const data = await res.json();

            const ctx = document.getElementById('myChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.labels,
                    datasets: [{
                        label: 'Rain (mm)',
                        data: data.precipitation,
                        borderColor: '#38bdf8',
                        yAxisID: 'y',
                    }, {
                        label: 'Contamination (CFU)',
                        data: data.contamination,
                        borderColor: '#fbbf24',
                        yAxisID: 'y1',
                    }]
                },
                options: {
                    scales: {
                        y: { type: 'linear', position: 'left', title: {display: true, text: 'Rain (mm)'}},
                        y1: { type: 'linear', position: 'right', title: {display: true, text: 'Bacteria (CFU)'}, grid: {drawOnChartArea: false}}
                    }
                }
            });
            
            // Set animation based on the peak of the chart
            targetH = 85; 
            document.getElementById('prediction-text').innerText = "Prediction: 98% Probability of CSO Overflow based on 2023 flood patterns.";
            document.getElementById('prediction-text').style.color = "#ef4444";
        }

        // 2. Water Animation (Same as before)
        const wCanvas = document.getElementById('water');
        const wCtx = wCanvas.getContext('2d');
        wCanvas.width = 500; wCanvas.height = 300;
        let targetH = 20; let currentH = 20; let offset = 0;

        function animateWater() {
            wCtx.clearRect(0, 0, 500, 300);
            currentH += (targetH - currentH) * 0.02;
            wCtx.fillStyle = (currentH > 50) ? "#5d4037" : "#0ea5e9";
            wCtx.beginPath();
            wCtx.moveTo(0, 300);
            for (let x = 0; x <= 500; x++) {
                let y = Math.sin(x * 0.02 + offset) * 5 + (300 - currentH * 2.5);
                wCtx.lineTo(x, y);
            }
            wCtx.lineTo(500, 300); wCtx.fill();
            offset += 0.05;
            requestAnimationFrame(animateWater);
        }

        initDashboard();
        animateWater();
    </script>
</body>
</html>
