<!DOCTYPE html>
<html>
<head>
    <title>Gowanus Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 40px; }
        .container { background: white; width: 900px; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .status-box { padding: 20px; border-radius: 10px; color: white; margin: 20px 0; transition: 0.5s; }
        .btn-group { margin-bottom: 20px; }
        button { padding: 12px 20px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; margin: 5px; }
        #val-display { font-size: 3rem; font-weight: bold; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Gowanus Canal Intelligence</h2>
        
        <div class="btn-group">
            <button style="background: #6b7280; color: white;" onclick="loadData('before')">Historical (Raw)</button>
            <button style="background: #3b82f6; color: white;" onclick="loadData('after')">AI Predicted (Clean)</button>
        </div>

        <div id="status-card" class="status-box" style="background: #6b7280;">
            <span id="val-display">0.0</span>
            <h3 id="msg">Select Mode to Analyze</h3>
            <p id="act"></p>
        </div>

        <canvas id="chart"></canvas>
    </div>

    <script>
        let chart;
        function loadData(mode) {
            fetch('/api/data/' + mode).then(r => r.json()).then(data => {
                document.getElementById('val-display').innerText = data.current + " ft";
                document.getElementById('status-card').style.backgroundColor = data.status.color;
                document.getElementById('msg').innerText = data.status.msg;
                document.getElementById('act').innerText = data.status.act;

                if(chart) chart.destroy();
                chart = new Chart(document.getElementById('chart'), {
                    type: 'line',
                    data: {
                        labels: data.labels.map(l => l.split(' ')[1]),
                        datasets: [{ label: 'Water Level', data: data.values, borderColor: 'white', backgroundColor: data.status.color + '44', fill: true }]
                    },
                    options: { scales: { y: { min: 0, max: 5 } } }
                });
            });
        }
    </script>
</body>
</html>
