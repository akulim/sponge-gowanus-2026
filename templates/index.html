<!DOCTYPE html>
<html>
<head>
    <title>Gowanus Debug Mode</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 15px; max-width: 800px; margin: auto; }
        button { padding: 10px 20px; margin: 10px; cursor: pointer; background: #38bdf8; border: none; border-radius: 5px; font-weight: bold; }
        #status { color: #fbbf24; margin: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Gowanus Canal System</h1>
    <p>Debug Mode Active</p>

    <div class="card">
        <button onclick="fetchData('/api/historical')">1. Test Historical (CSV)</button>
        <button onclick="fetchData('/api/forecast')">2. Test Forecast (Math)</button>
        
        <div id="status">Status: Waiting for input...</div>
        <canvas id="myChart"></canvas>
    </div>

    <script>
        let chart;
        async function fetchData(url) {
            const status = document.getElementById('status');
            status.innerText = "Status: Fetching data...";
            console.log("Fetching from:", url);

            try {
                const response = await fetch(url);
                console.log("Response status:", response.status);
                
                if (!response.ok) {
                    const errBody = await response.json();
                    throw new Error(errBody.error || "Server Error");
                }

                const data = await response.json();
                console.log("Data received:", data);

                // Handle both formats (Object with labels/values OR Array of objects)
                const labels = data.labels || data.map(d => d.time);
                const values = data.values || data.map(d => d.value);

                if (chart) chart.destroy();
                const ctx = document.getElementById('myChart').getContext('2d');
                chart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{ label: 'Gage Height', data: values, borderColor: '#38bdf8' }]
                    }
                });

                status.innerText = "Status: Success!";
            } catch (err) {
                console.error("Full Error:", err);
                status.innerText = "Status: ERROR - " + err.message;
                alert("App Error: " + err.message);
            }
        }
    </script>
</body>
</html>
